name: front_end
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.4
  connectivity_plus: ^7.0.0
  network_info_plus: ^7.0.0
  permission_handler: ^12.0.1
  provider: ^6.1.5+1
  fl_chart: ^0.70.2
  web_socket_channel: ^3.0.2
  speech_to_text: ^7.0.0
  flutter_local_notifications: ^18.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/

  fonts:
    - family: ShareTech
      fonts:
        - asset: assets/fonts/ShareTech-Regular.ttf
